<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="actionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="amberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#actionGrad)" />
  <rect width="800" height="500" rx="16" fill="url(#grid)" />
  <rect x="12" y="12" width="776" height="476" rx="12" fill="none" stroke="url(#amberBorder)" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Badge / Category -->
  <g transform="translate(40, 50)">
    <rect width="210" height="32" rx="16" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="105" y="21" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1.5">LIVE COMPETITION</text>
  </g>

  <!-- Center Graphic Element (Swords / Network Switch & Server) -->
  <g transform="translate(400, 190)">
    <circle r="56" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2" />
    <circle r="44" fill="#f59e0b" fill-opacity="0.15" />
    <!-- Network nodes & connection lines -->
    <path d="M -24 0 L 24 0 M 0 -24 L 0 24 M -16 -16 L 16 16 M -16 16 L 16 -16" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6" />
    <circle cx="-20" cy="0" r="5" fill="#f59e0b" />
    <circle cx="20" cy="0" r="5" fill="#f59e0b" />
    <circle cx="0" cy="-20" r="5" fill="#38bdf8" />
    <circle cx="0" cy="20" r="5" fill="#38bdf8" />
    <circle cx="0" cy="0" r="8" fill="#ffffff" />
  </g>

  <!-- Content text -->
  <text x="400" y="300" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">ภาพการแข่งขัน &amp; คอนฟิกระบบเครือข่าย</text>
  <text x="400" y="335" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15" text-anchor="middle">การตั้งค่า Cloud Controller, Wi-Fi Fast Roaming &amp; QoS</text>

  <!-- Bottom notice -->
  <g transform="translate(400, 420)">
    <rect x="-175" y="-18" width="350" height="36" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="0" y="5" fill="#38bdf8" font-family="monospace" font-size="12" text-anchor="middle">ENTERPRISE NETWORK LAB • COMPETITION ARENA</text>
  </g>
</svg>
