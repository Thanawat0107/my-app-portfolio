<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.8" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)" />
  <rect width="800" height="500" rx="16" fill="url(#grid)" />
  <rect x="12" y="12" width="776" height="476" rx="12" fill="none" stroke="url(#goldBorder)" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Badge / Category -->
  <g transform="translate(40, 50)">
    <rect width="180" height="32" rx="16" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1"/>
    <text x="90" y="21" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1.5">STUDENT ACTIVITY</text>
  </g>

  <!-- Center Graphic Element -->
  <g transform="translate(400, 190)">
    <circle r="56" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="2" />
    <circle r="44" fill="#8b5cf6" fill-opacity="0.2" />
    <path d="M -16 -8 L 0 -24 L 16 -8 L 10 16 L -10 16 Z" fill="#8b5cf6" />
  </g>

  <!-- Content text -->
  <text x="400" y="300" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">สโมสรนักศึกษา ประจำปีการศึกษา 2567</text>
  <text x="400" y="335" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15" text-anchor="middle">คณะวิทยาศาสตร์และเทคโนโลยี มหาวิทยาลัยราชภัฏกาญจนบุรี</text>

  <!-- Bottom notice -->
  <g transform="translate(400, 420)">
    <rect x="-160" y="-18" width="320" height="36" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="0" y="5" fill="#38bdf8" font-family="monospace" font-size="12" text-anchor="middle">STUDENT COUNCIL AFFAIRS • OFFICIAL RECORD</text>
  </g>
</svg>