<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="supalaiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="emeraldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>
    <pattern id="gridWork" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#supalaiBg)" />
  <rect width="800" height="500" rx="16" fill="url(#gridWork)" />
  <rect x="12" y="12" width="776" height="476" rx="12" fill="none" stroke="url(#emeraldBorder)" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Badge / Category -->
  <g transform="translate(40, 50)">
    <rect width="250" height="32" rx="16" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
    <text x="125" y="21" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1.5">ENTERPRISE INTERNSHIP</text>
  </g>

  <!-- Center Graphic Element (EIA Dashboard / Code / Enterprise Architecture) -->
  <g transform="translate(400, 185)">
    <circle r="56" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3" stroke-width="2" />
    <circle r="44" fill="#047857" fill-opacity="0.25" />
    <!-- Dashboard / Code Icon -->
    <rect x="-22" y="-16" width="44" height="32" rx="4" fill="none" stroke="#34d399" stroke-width="2.5" />
    <line x1="-16" y1="-8" x2="0" y2="-8" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
    <line x1="-16" y1="-1" x2="16" y2="-1" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="-16" y1="6" x2="8" y2="6" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Content text -->
  <text x="400" y="295" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="bold" text-anchor="middle">ระบบติดตามผลกระทบสิ่งแวดล้อม (EIA Phase 2)</text>
  <text x="400" y="330" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15" text-anchor="middle">SUPALAI Tech Talent Program 2026 • บมจ. ศุภาลัย (สำนักงานใหญ่)</text>

  <!-- Bottom notice -->
  <g transform="translate(400, 420)">
    <rect x="-190" y="-18" width="380" height="36" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="0" y="5" fill="#34d399" font-family="monospace" font-size="12" text-anchor="middle">C# • .NET CORE • NEXT.JS • POSTGRESQL • ENTERPRISE CI/CD</text>
  </g>
</svg>
