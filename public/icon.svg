<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Container (matches rounded-md theme) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-width="3" stroke-opacity="0.85" />
  
  <!-- Subtle Top Accent Line -->
  <line x1="16" y1="2" x2="48" y2="2" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
  
  <!-- Monogram TB -->
  <text 
    x="30" 
    y="44" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="31" 
    font-weight="900" 
    letter-spacing="-2"
    text-anchor="middle"
  >
    <tspan fill="url(#textGrad)">T</tspan><tspan fill="#38bdf8">B</tspan>
  </text>
  
  <!-- Terminal Accent Dot -->
  <circle cx="51" cy="43" r="3" fill="#34d399" />
</svg>
